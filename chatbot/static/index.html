<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국어 쓰기 피드백</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f0f2f5;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* --- 비밀번호 화면 --- */
#authOverlay {
  position: fixed;
  inset: 0;
  background: #f0f2f5;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.auth-box {
  background: #fff;
  border-radius: 16px;
  padding: 40px 32px;
  width: 320px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.10);
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
}

.auth-box h2 {
  font-size: 18px;
  font-weight: 700;
  color: #333;
}

.auth-box p {
  font-size: 13px;
  color: #888;
  text-align: center;
}

.auth-box input[type="text"],
.auth-box input[type="password"] {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

.auth-box input[type="text"]:focus,
.auth-box input[type="password"]:focus {
  border-color: #4a90d9;
}

.auth-box button {
  width: 100%;
  padding: 11px;
  background: #4a90d9;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.auth-box button:disabled {
  background: #a0c4e8;
  cursor: default;
}

.auth-error {
  font-size: 13px;
  color: #e05c5c;
  min-height: 18px;
}

/* --- 전체 레이아웃 --- */
.app-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* --- 사이드바 --- */
.sidebar {
  width: 220px;
  background: #1e2535;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}

.sidebar-header {
  padding: 16px 12px 10px;
  border-bottom: 1px solid #2d3548;
}

.sidebar-title {
  font-size: 13px;
  font-weight: 700;
  color: #9ba8c0;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.new-chat-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 12px;
  background: #4a90d9;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}

.new-chat-btn:hover { background: #3a7bbf; }

.new-chat-btn svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.conv-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.conv-list::-webkit-scrollbar { width: 4px; }
.conv-list::-webkit-scrollbar-track { background: transparent; }
.conv-list::-webkit-scrollbar-thumb { background: #3a4256; border-radius: 2px; }

.conv-item {
  position: relative;
  display: flex;
  align-items: center;
  padding: 9px 12px;
  cursor: pointer;
  border-radius: 6px;
  margin: 1px 6px;
  transition: background 0.12s;
  group: true;
}

.conv-item:hover { background: #2d3548; }
.conv-item.active { background: #2d3548; }
.conv-item.active::before {
  content: "";
  position: absolute;
  left: 0;
  top: 4px;
  bottom: 4px;
  width: 3px;
  background: #4a90d9;
  border-radius: 0 2px 2px 0;
}

.conv-title {
  flex: 1;
  font-size: 13px;
  color: #c8d0e0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.conv-item.active .conv-title { color: #fff; }

.conv-del-btn {
  display: none;
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  background: none;
  border: none;
  cursor: pointer;
  color: #6b7a99;
  border-radius: 4px;
  align-items: center;
  justify-content: center;
  padding: 0;
  font-size: 14px;
  line-height: 1;
}

.conv-item:hover .conv-del-btn { display: flex; }
.conv-del-btn:hover { color: #e05c5c; background: rgba(224,92,92,0.12); }

/* --- 메인 콘텐츠 --- */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

header {
  background: #4a90d9;
  color: #fff;
  text-align: center;
  padding: 14px;
  font-size: 18px;
  font-weight: 700;
  flex-shrink: 0;
}

.topic-bar {
  background: #fff;
  border-bottom: 1px solid #ddd;
  flex-shrink: 0;
}

.topic-toggle {
  display: block;
  width: 100%;
  padding: 8px 16px;
  border: none;
  background: none;
  text-align: left;
  cursor: pointer;
  font-size: 13px;
  color: #666;
}

.topic-toggle:hover { background: #fafafa; }

.topic-input-wrap {
  display: none;
  padding: 0 16px 10px;
}

.topic-input-wrap.open { display: block; }

.topic-input-wrap input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 14px;
}

.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg.user {
  align-self: flex-end;
  background: #4a90d9;
  color: #fff;
  border-bottom-right-radius: 4px;
}

.msg.bot {
  align-self: flex-start;
  background: #fff;
  color: #222;
  border: 1px solid #e0e0e0;
  border-bottom-left-radius: 4px;
}

.msg.bot { white-space: normal; }
.msg.bot strong { font-weight: 700; }
.msg.bot em { font-style: italic; }
.msg.bot code {
  background: #f0f0f0;
  border-radius: 4px;
  padding: 1px 5px;
  font-family: monospace;
  font-size: 0.92em;
}
.msg.bot ul {
  margin: 4px 0;
  padding-left: 18px;
}
.msg.bot li { margin: 2px 0; }

.typing {
  align-self: flex-start;
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 14px;
  padding: 10px 18px;
  font-size: 14px;
  color: #888;
}

.typing span {
  animation: blink 1.4s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; }
  40% { opacity: 1; }
}

.input-bar {
  display: flex;
  gap: 8px;
  padding: 10px 16px;
  background: #fff;
  border-top: 1px solid #ddd;
  flex-shrink: 0;
}

.input-bar textarea {
  flex: 1;
  resize: none;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 15px;
  font-family: inherit;
  line-height: 1.4;
  min-height: 44px;
  max-height: 120px;
}

.input-bar button {
  padding: 0 20px;
  background: #4a90d9;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  flex-shrink: 0;
}

.input-bar button:disabled {
  background: #a0c4e8;
  cursor: default;
}

/* --- 반응형: 모바일에서 사이드바 숨김 --- */
@media (max-width: 600px) {
  .sidebar { display: none; }
}
</style>
</head>
<body>

<!-- 비밀번호 입력 화면 -->
<div id="authOverlay">
  <div class="auth-box">
    <h2>🔒 한국어 쓰기 피드백</h2>
    <p>이름(영문자)과 암호를 입력하세요.</p>
    <input type="text" id="usernameInput" placeholder="이름 (영문자, 예: Alice)" autocomplete="username" maxlength="50">
    <input type="password" id="passwordInput" placeholder="암호 입력" autocomplete="current-password">
    <div class="auth-error" id="authError"></div>
    <button id="authBtn">확인</button>
  </div>
</div>

<div class="app-layout">
  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">대화 목록</div>
      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        새 대화
      </button>
    </div>
    <div class="conv-list" id="convList"></div>
  </aside>

  <!-- 메인 콘텐츠 -->
  <div class="main-content">
    <header>한국어 쓰기 피드백</header>

    <div class="topic-bar">
      <button class="topic-toggle" id="topicToggle">📝 과제 주제 설정 ▸</button>
      <div class="topic-input-wrap" id="topicWrap">
        <input type="text" id="topicInput" placeholder="예: 자기소개, 주말 계획, 좋아하는 음식">
      </div>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="input-bar">
      <textarea id="userInput" rows="1" placeholder="한국어로 문장을 써 보세요"></textarea>
      <button id="sendBtn">전송</button>
    </div>
  </div>
</div>

<script>
// --- 인증 ---
const authOverlay = document.getElementById("authOverlay");
const usernameInput = document.getElementById("usernameInput");
const passwordInput = document.getElementById("passwordInput");
const authBtn = document.getElementById("authBtn");
const authError = document.getElementById("authError");

let authToken = sessionStorage.getItem("auth_token") || "";

async function tryLogin() {
  const username = usernameInput.value.trim();
  const pw = passwordInput.value;
  if (!username || !pw) return;

  // 클라이언트 사전 검증 (UX용)
  if (!/^[a-zA-Z]{1,50}$/.test(username)) {
    authError.textContent = "이름은 영문자 1~50자만 허용됩니다.";
    usernameInput.focus();
    return;
  }

  authBtn.disabled = true;
  authError.textContent = "";
  try {
    const res = await fetch("/api/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password: pw })
    });
    if (res.ok) {
      const data = await res.json();
      authToken = data.token;
      sessionStorage.setItem("auth_token", authToken);
      sessionStorage.setItem("auth_username", username);
      authOverlay.style.display = "none";
      await loadConversations();
    } else {
      const err = await res.json().catch(() => ({}));
      authError.textContent = err.detail || "암호가 올바르지 않습니다.";
      passwordInput.value = "";
      passwordInput.focus();
    }
  } catch {
    authError.textContent = "서버에 연결할 수 없습니다.";
  }
  authBtn.disabled = false;
}

authBtn.addEventListener("click", tryLogin);
usernameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") passwordInput.focus();
});
passwordInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") tryLogin();
});

if (authToken) {
  authOverlay.style.display = "none";
  loadConversations();
}

// --- 대화 상태 ---
let currentConvId = null;

// --- 사이드바 ---
const convList = document.getElementById("convList");
const newChatBtn = document.getElementById("newChatBtn");

function authHeaders() {
  return { "Content-Type": "application/json", "Authorization": "Bearer " + authToken };
}

async function loadConversations() {
  try {
    const res = await fetch("/api/conversations", { headers: authHeaders() });
    if (res.status === 401) { showAuth(); return; }
    if (!res.ok) return;
    const convs = await res.json();
    renderConvList(convs);
  } catch { /* 무시 */ }
}

function renderConvList(convs) {
  convList.innerHTML = "";
  convs.forEach(c => {
    const item = document.createElement("div");
    item.className = "conv-item" + (c.id === currentConvId ? " active" : "");
    item.dataset.id = c.id;

    const title = document.createElement("span");
    title.className = "conv-title";
    title.textContent = c.title;

    const delBtn = document.createElement("button");
    delBtn.className = "conv-del-btn";
    delBtn.title = "삭제";
    delBtn.innerHTML = "✕";
    delBtn.addEventListener("click", async (e) => {
      e.stopPropagation();
      await deleteConversation(c.id);
    });

    item.appendChild(title);
    item.appendChild(delBtn);
    item.addEventListener("click", () => switchConversation(c.id));
    convList.appendChild(item);
  });
}

async function switchConversation(cid) {
  try {
    const res = await fetch(`/api/conversations/${cid}`, { headers: authHeaders() });
    if (res.status === 401) { showAuth(); return; }
    if (!res.ok) return;
    const conv = await res.json();
    currentConvId = cid;
    renderChatFromHistory(conv.turns);
    updateActiveItem(cid);
  } catch { /* 무시 */ }
}

function renderChatFromHistory(turns) {
  chatArea.innerHTML = "";
  turns.forEach(t => {
    if (t.role === "user") {
      addMsg(t.text, "user");
    } else {
      addMsg(t.text, "bot");
    }
  });
}

function updateActiveItem(cid) {
  document.querySelectorAll(".conv-item").forEach(el => {
    el.classList.toggle("active", el.dataset.id === cid);
  });
}

async function deleteConversation(cid) {
  try {
    const res = await fetch(`/api/conversations/${cid}`, {
      method: "DELETE",
      headers: authHeaders()
    });
    if (res.status === 401) { showAuth(); return; }
    if (cid === currentConvId) {
      currentConvId = null;
      chatArea.innerHTML = "";
    }
    await loadConversations();
  } catch { /* 무시 */ }
}

newChatBtn.addEventListener("click", () => {
  currentConvId = null;
  chatArea.innerHTML = "";
  updateActiveItem(null);
  userInput.focus();
});

function showAuth() {
  sessionStorage.removeItem("auth_token");
  sessionStorage.removeItem("auth_username");
  authToken = "";
  authError.textContent = "";
  usernameInput.value = "";
  passwordInput.value = "";
  authOverlay.style.display = "flex";
}

// --- 채팅 ---
const chatArea = document.getElementById("chatArea");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const topicToggle = document.getElementById("topicToggle");
const topicWrap = document.getElementById("topicWrap");
const topicInput = document.getElementById("topicInput");

topicToggle.addEventListener("click", () => {
  const open = topicWrap.classList.toggle("open");
  topicToggle.textContent = open ? "📝 과제 주제 설정 ▾" : "📝 과제 주제 설정 ▸";
  if (open) topicInput.focus();
});

userInput.addEventListener("input", () => {
  userInput.style.height = "auto";
  userInput.style.height = Math.min(userInput.scrollHeight, 120) + "px";
});

let isComposing = false;
userInput.addEventListener("compositionstart", () => { isComposing = true; });
userInput.addEventListener("compositionend", () => { isComposing = false; });

userInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !isComposing) {
    e.preventDefault();
    send();
  }
});

sendBtn.addEventListener("click", send);

function mdToHtml(text) {
  // 1) HTML 이스케이프 (XSS 방지)
  let s = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");

  // 2) 인라인 변환 (순서 중요: code 먼저)
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");

  // 3) 블록 변환: 연속된 "- " 줄 → <ul><li>
  s = s.replace(/((?:^|\n)- .+)+/g, (block) => {
    const items = block.trim().split("\n").map(line =>
      "<li>" + line.replace(/^- /, "") + "</li>"
    ).join("");
    return "\n<ul>" + items + "</ul>\n";
  });

  // 4) 나머지 줄바꿈 → <br> (단, <ul> 앞뒤 \n은 제거)
  s = s.replace(/\n/g, "<br>");
  s = s.replace(/<br>(<ul>)/g, "$1");
  s = s.replace(/(<\/ul>)<br>/g, "$1");

  return s;
}

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  if (cls === "bot") {
    div.innerHTML = mdToHtml(text);
  } else {
    div.textContent = text;
  }
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "typing";
  div.id = "typing";
  div.innerHTML = "<span>●</span> <span>●</span> <span>●</span>";
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById("typing");
  if (el) el.remove();
}

async function send() {
  const text = userInput.value.trim();
  if (!text) return;

  addMsg(text, "user");
  userInput.value = "";
  userInput.style.height = "auto";
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({
        learner_text: text,
        task_topic: topicInput.value.trim(),
        conversation_id: currentConvId
      })
    });

    hideTyping();

    if (res.status === 401) {
      showAuth();
      sendBtn.disabled = false;
      return;
    }

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addMsg("오류: " + (err.detail || res.statusText), "bot");
    } else {
      const data = await res.json();
      addMsg(data.feedback, "bot");
      // 새 대화인 경우 conversation_id 수신 후 사이드바 갱신
      if (currentConvId !== data.conversation_id) {
        currentConvId = data.conversation_id;
      }
      await loadConversations();
      updateActiveItem(currentConvId);
    }
  } catch (e) {
    hideTyping();
    addMsg("서버에 연결할 수 없습니다.", "bot");
  }

  sendBtn.disabled = false;
  userInput.focus();
}
</script>

</body>
</html>
